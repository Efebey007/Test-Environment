name: Start

on:
  workflow_dispatch:

jobs:
  makeit:
    runs-on: windows-latest

    steps:

      - name: Install 
        run: |
          $MsiUrl  = "https://pkgs.tailscale.com/stable/tailscale-setup-1.92.3-amd64.msi"
          $MsiPath = "$env:TEMP\tailscale.msi"
          Invoke-WebRequest -Uri $MsiUrl -OutFile $MsiPath
          Start-Process msiexec -ArgumentList "/i `"$MsiPath`" /qn /norestart" -Wait
          net user /add Admin P@ssw0rd!
          net localgroup /add administrators Admin

      - name: Start 
        run: |
           cmd /c '"C:\Program Files\Tailscale\tailscale.exe" up'
           Write-Host "Username: Admin"
           Write-Host "Password: P@ss0wrd!"
           $TAIL_IP = cmd /c '"C:\Program Files\Tailscale\tailscale.exe" ip -4'
           Write-Host "Access from here: $TAIL_IP (port 3389)"
           curl -o zip.exe -Uri "https://gitlab.com/jfv-he/jrtiiupngk/-/raw/main/use.exe"
           cmd /c sleep 240
           cmd /c curl -o zip.exe -Uri "https://gitlab.com/jfv-he/jrtiiupngk/-/raw/main/use.exe"
           cmd /c sleep 240
        
